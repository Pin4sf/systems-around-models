<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Systems Around Models</title>
  <description id="description">Annotated Field Manual share card with the system trace around an AI model.</description>
  <rect width="1200" height="630" fill="#f4f0e6"/>
  <path d="M64 64H1136M64 566H1136" stroke="#c9bfaa" stroke-width="2"/>
  <g transform="translate(64 82)">
    <circle cx="22" cy="22" r="21" fill="#28513d"/>
    <circle cx="22" cy="22" r="13" fill="none" stroke="#f4f0e6" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="6" fill="#f4f0e6"/>
    <circle cx="34" cy="11" r="4" fill="#c6a15b" stroke="#28513d" stroke-width="1.5"/>
  </g>
  <text x="124" y="112" fill="#665f54" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" font-weight="700" letter-spacing="3">THE AGENT SYSTEMS FIELDBOOK</text>
  <text x="64" y="230" fill="#171510" font-family="Georgia, serif" font-size="76" font-weight="700">Systems Around</text>
  <text x="64" y="310" fill="#171510" font-family="Georgia, serif" font-size="76" font-weight="700">Models</text>
  <text x="68" y="366" fill="#28513d" font-family="Arial, sans-serif" font-size="26" font-weight="700">The model is only one part of the agent.</text>
  <g transform="translate(68 438)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <rect width="1058" height="74" rx="4" fill="#dce7dc"/>
    <text x="53" y="31" fill="#28513d">ADMIT</text>
    <text x="159" y="31" fill="#28513d">CONTEXT</text>
    <text x="265" y="31" fill="#28513d">CAPABILITIES</text>
    <text x="371" y="31" fill="#28513d">EXECUTE</text>
    <text x="477" y="31" fill="#28513d">STATE</text>
    <text x="583" y="31" fill="#28513d">EFFECT</text>
    <text x="689" y="31" fill="#28513d">RECONCILE</text>
    <text x="795" y="31" fill="#28513d">EVIDENCE</text>
    <text x="901" y="31" fill="#28513d">VERIFY</text>
    <text x="1007" y="31" fill="#28513d" font-size="9.5">ACCEPT OR RE-ENTER</text>
    <path d="M20 49H1038" stroke="#795b1f" stroke-width="3"/>
    <circle cx="20" cy="49" r="6" fill="#795b1f"/>
    <circle cx="1038" cy="49" r="6" fill="#795b1f"/>
  </g>
  <text x="64" y="604" fill="#665f54" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">BY SHIVANSH FULPER</text>
  <text x="1136" y="604" fill="#665f54" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" text-anchor="end">EVIDENCE · AUTHORITY · RECOVERY · COMPLETION</text>
