summary: An open terminal agent that combines a conversational loop, local tools, and extension surfaces around Gemini models.
primary_job: Bring model-guided coding and research work into a terminal workspace.
teaching_question: How does an open terminal harness balance built-in tools with extensibility?
coordination_shape: iterative-loop
control_owner: The CLI runtime coordinates model turns, built-in tools, and configured extensions.
context_model: Conversation, project context, instructions, and tool outputs are assembled for the model.
state_model: Session and project context support continuity; the complete durability contract needs deeper inspection.
authority_boundary: The CLI mediates local tools while extensions can widen the effective capability boundary.
recovery_model: Checkpoint and resume behavior must be separated from ordinary conversational continuity.
verification_model: Tool results and checks inform the run; external project policy decides acceptance.
transferable_lesson: Extensibility makes capability discovery and authority boundaries part of the architecture.
deliberate_omissions:
  - The CLI does not own application-specific completion policy or deployment acceptance.
