study:
  deck: A source-pinned study of a concrete coding loop, an event-derived session model, and a plugin runtime designed to make ownership and teardown explicit.
  evidence_boundary: Mechanism claims below are implementation-pinned to DeepSeek Harness 47f943859bef and Cordis 8cc9e33fab69. They are not a production-readiness claim. The newer upstream head remains a named refresh target.
  system_boundary:
    - DeepSeek Harness owns one coding agent's turn and step lifecycle, context assembly, capability dispatch, session facts, and runtime projections.
    - Cordis owns in-process composition through contexts, services, dependencies, lifecycle fibers, and registered inverse effects.
    - The developer and surrounding product still own outcome acceptance, production policy, and consequences outside the local runtime.
  mechanism_notes:
    - title: One reconstructable session record
      body: Normalized session events feed provider requests, trajectories, queries, persistence, and interface views. The useful invariant is not merely that events are logged, but that model-visible history can be derived from them.
    - title: Overlap execution, preserve causal commit
      body: Concurrency-safe tool bodies may overlap within bounds. Exclusive calls form barriers, while results and deferred context commit in model order so wall-clock timing does not rewrite durable meaning.
    - title: Reversible ownership
      body: Cordis associates registrations and cleanup with lifecycle owners. Unload can unwind those effects in reverse order, making residue testable without pretending that arbitrary external effects are reversible.
  failure_boundary:
    - A correct inverse is an author obligation; the runtime cannot prove that cleanup restores the intended semantics.
    - The documented trust model is a developer preview and does not establish multi-tenant or public-network security.
    - The inspected mechanism pin trails upstream head b150a551b8d465e31e418e1b2eaf5e79bbb7d28e.
  retrieval_check: Why can the runtime overlap two tool bodies but still commit their durable results in the model's original order? Name the property this preserves, then explain why reversible plugin cleanup does not imply rollback of an external payment.
  refresh_target: Upstream refresh target is DeepSeek Harness b150a551b8d465e31e418e1b2eaf5e79bbb7d28e at package 0.1.1-rc.2.
  native_diagram: deepseek-session-lifecycle
  adopt_adapt_reject:
    adopt: Adopt reconstructable session facts, frozen attempt inputs, and explicit lifecycle ownership for long-lived registrations.
    adapt: Adapt reversible plugin effects behind a stronger authority model and separate external-effect reconciliation contract.
    reject: Reject the assumption that in-process cleanup proves semantic rollback, production security, or whole-product acceptance.
