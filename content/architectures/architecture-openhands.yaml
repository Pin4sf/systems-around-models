id: architecture-openhands
slug: openhands
name: OpenHands
record_kind: system
product_class: frontier-coding-harness
status: public
summary: A public Agent Canvas control surface that makes its separation from the agent server, client, automation service, and sandbox explicit.
primary_job: Give users an interactive surface for conversations, terminals, browser and file views, settings, backends, and automations.
teaching_question: What becomes explicit when the interface, execution runtime, client, automation service, and sandbox are separate modules?
coordination_shape: durable-runtime
control_owner: Agent Canvas mediates user interaction while the selected external agent server owns model decisions and actions.
context_model: The Canvas presents conversation and tool events received through a client; runtime context assembly belongs to the agent server and SDK.
state_model: Interface and session state are distinct from server execution state, workspace state, and scheduled automation state.
authority_boundary: Backend selection and integrations can widen custody and effects beyond the Canvas; the interface does not itself establish sandbox or credential policy.
recovery_model: Durable execution and workspace recovery are not established by this Canvas source and depend on the selected server, automation, and deployment path.
verification_model: The Canvas can present events and artifacts for review; the executing runtime provides checks while the project owner retains acceptance.
transferable_lesson: A product interface, agent runtime, client, automation service, and sandbox are distinct responsibility and custody surfaces.
deliberate_omissions:
  - The Agent Canvas source does not establish the implementation guarantees of the separate runtime or sandbox.
topology_steps:
  - { stage: admit, label: Admit, ownership: delegated, description: The Canvas submits the task through a client to the selected agent server. }
  - { stage: assemble, label: Assemble, ownership: external, description: The agent server and SDK assemble model-visible task and runtime context. }
  - { stage: bind, label: Bind, ownership: external, description: The external runtime binds tools, integrations, credentials, and sandbox access. }
  - { stage: run, label: Run, ownership: external, description: The external agent server executes decisions and environment actions while Canvas presents events. }
  - { stage: recover, label: Recover, ownership: not-established, description: Deployment and runtime configuration determine durable recovery guarantees. }
  - { stage: verify-close, label: Verify and close, ownership: delegated, description: Canvas presents checks and artifacts while project acceptance remains user-owned. }
lifecycle_trace:
  - { order: 1, label: Select backend, owner: User and Agent Canvas, outcome: A client and execution authority are chosen. }
  - { order: 2, label: Submit task, owner: Agent Canvas and client, outcome: The selected agent server receives the conversation request. }
  - { order: 3, label: Execute work, owner: Agent server and sandbox, outcome: External runtime modules produce actions, events, and artifacts. }
  - { order: 4, label: Inspect outcome, owner: User or evaluator, outcome: Presented events, artifacts, and checks are reviewed for acceptance. }
