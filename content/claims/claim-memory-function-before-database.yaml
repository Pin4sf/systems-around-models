id: claim-memory-function-before-database
statement: Memory function, query shape, and held-out failures should determine whether a system needs files, records, indexes, or more structure; builders should begin with canonical records and deterministic retrieval.
label: proposed
scope: Memory Engineering study guide
source_ids:
