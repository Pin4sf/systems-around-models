source_type: first-party-repository
basis: Commit-pinned documentation and implementation inspection of the current post-v0.4.16 repository across URI identity, directory sidecars, retrieval, context assembly, sessions, recovery, multi-tenancy, context compilation, and licensing.
license_status: AGPL-3.0
evidence_grade: IP
observed_mechanisms:
  - description: The repository documents a viking URI hierarchy that organizes resources, user and peer memories, and skills under account and authenticated-user boundaries.
    evidence_grade: FD
    basis: The pinned URI, context-type, and multi-tenant documents define the addressable context hierarchy and identity-relative home alias.
  - description: L0 abstracts and L1 overviews are derived directory sidecars with explicit body limits, metadata, sampling, and freshness fields; L2 remains source detail.
    evidence_grade: FD
    basis: The pinned context-layer document defines the sidecar storage and projection behavior.
  - description: Retrieval plans typed queries over memory, resource, and skill roots, recursively explores directories, and may rerank candidates.
    evidence_grade: FD
    basis: The pinned retrieval document defines find and search, typed-query planning, recursive traversal, and fallback scoring.
  - description: Session commit archives messages before asynchronous summary and memory extraction and writes a per-commit memory change record.
    evidence_grade: FD
    basis: The pinned session and transaction documents define the two-phase boundary, persistent queue recovery, and memory_diff artifact.
  - description: Context compilation delegates source-to-artifact work to VikingBot and a selected Skill, producing derived Wiki, graph, report, or distillation outputs.
    evidence_grade: FD
    basis: The pinned context-compilation documents define the asynchronous agent loop and output contracts.
  - description: The request-time context assembler gathers authenticated memory, resource, and skill candidates, loads selected representation tiers, applies peer and token-budget policy, renders an injection-ready envelope, and records only entries served.
    evidence_grade: IP
    basis: The inspected context-assembler parameters, gatherer, pipeline, and best-effort recall ledger implement these boundaries.
  - description: Session commit archives a lock-protected snapshot before restart-safe asynchronous extraction; durable archive completion does not prove phase-two extraction completion.
    evidence_grade: IP
    basis: The inspected session and persistent queue processor implement the two-phase boundary and identity restoration.
author_reported_claims:
  - The repository README reports improved memory and agent-task benchmark results together with lower token use and query latency for OpenViking 0.3.22, not the v0.4.16 release or inspected post-release commit.
unknowns:
  - The inspected documentation does not establish belief acceptance, correction authority, deletion propagation, or current effect authority for every captured or compiled memory.
  - The memory diff is useful audit and manual rollback input, but no first-party automated rollback API was found.
  - Benchmark results, hosted editions, and production multi-tenant guarantees were not independently reproduced.
falsifiers:
  - The pinned documents do not define directory-level L0 and L1 sidecars, hierarchical retrieval, identity-bound user paths, or two-phase session commit as recorded here.
  - The v0.4.16 release tag is shown to include every post-release behavior attributed only to the inspected current commit.
