author_reported_claims:
  - A beginner harness model consists of a system prompt, tools, an agent loop, and a provider translation layer.
  - The harness turns a model into an agent that can execute tasks.
  - Earendil argues that people can own and adapt their agent harness, use its translation layer to choose among model providers, and retain local copies of sessions.
