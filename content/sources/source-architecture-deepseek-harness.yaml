basis: Commit-pinned inspection of dsh-v0.1.1-rc.2 across the concrete loop, ordered tool execution, append-only session contracts, crash-tail repair, and vendored Cordis lifecycle.
license_status: MIT
evidence_grade: IP
observed_mechanisms:
  - description: The runtime derives model requests, trajectories, and interface projections from a normalized session event stream.
    evidence_grade: IP
    basis: The inspected architecture documentation and session packages define durable events and their request projections.
  - description: Tool bodies may overlap within bounds while durable results commit in the model-declared order and exclusive calls form barriers.
    evidence_grade: IP
    basis: The inspected tool-call scheduler implements bounded execution and ordered causal commit.
  - description: Runtime profiles compose ordered plugin bundles, a profile-owned patch layer, and launcher patches into the resolved executable configuration.
    evidence_grade: IP
    basis: The inspected profile launcher and snapshot show provider, tool-mode, persistence, and plugin ownership changing through ordered composition.
  - description: Durable session events are distinct from live agent and capability extension events, including waterfalls that can intercept an in-flight request.
    evidence_grade: IP
    basis: The inspected architecture contract names which event families survive reload and which remain live extension seams.
author_reported_claims:
  - The project describes every product element as a plugin composed through Cordis contexts and services.
unknowns:
  - Public source does not establish production maturity, multi-tenant isolation, or complete external-effect reconciliation.
  - The runtime uses vendored @deepseek-ai/cordis 4.0.1 rather than the standalone cordis package, and compatibility-breaking changes remain expected during developer preview.
falsifiers:
  - Reinspection of the pinned paths contradicts the event, scheduling, or composition mechanics represented here.
