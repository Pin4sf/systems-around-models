source_type: first-party-repository
basis: Commit-pinned inspection of the released Agents and Think package pair across Durable Object state, fibers, submissions, sessions, recovery, actions, and channels.
license_status: MIT
evidence_grade: IP
observed_mechanisms:
  - description: Agents bind logical agent state, schedules, sub-agents, and recoverable fibers to Durable Object-backed storage and routing.
    evidence_grade: IP
    basis: The inspected package exports and first-party state, sub-agent, and durable-execution documentation define these runtime seams.
  - description: Think persists session branches and submissions, then unifies wait, stream, replay, and recovery paths around the same durable turn record.
    evidence_grade: IP
    basis: The inspected Think runtime, session, recovery, action, and channel paths implement the documented turn lifecycle.
  - description: Managed fibers, durable turn submissions, and Actions use distinct idempotency identities for application jobs, session admission, and effect results.
    evidence_grade: IP
    basis: The inspected durable-execution, programmatic-submission, and Action contracts assign different ledgers, retry behavior, and ambiguity states to each boundary.
  - description: Workspace shell access, reasoning disclosure, MCP inclusion, and chat recovery are default capabilities that can be narrowed or configured per runtime and turn.
    evidence_grade: IP
    basis: The release-pinned Think package contract lists the built-in workspace and its functional defaults.
author_reported_claims:
  - Cloudflare describes its Agents platform as scaling to very large numbers of idle and active Durable Object instances.
unknowns:
  - Think, runTurn, Actions, and Channels are experimental, authorization for Actions is opt-in, and a stable idempotency key is required for cross-retry deduplication.
  - Durable recovery does not make arbitrary external effects idempotent, and no live eviction, placement, cost, or sustained-scale test was performed here.
falsifiers:
  - Eviction loses or duplicates a persisted turn, recovery repeats a non-idempotent effect, or a channel-less turn unexpectedly inherits privileged channel policy.
last_validated: 2026-08-26
correction_ledger_status: reviewed
