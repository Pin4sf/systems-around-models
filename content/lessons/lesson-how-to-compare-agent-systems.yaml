id: lesson-how-to-compare-agent-systems
slug: how-to-compare-agent-systems
title: How to compare agent systems
status: public
problem: Agent systems are often compared as feature lists even when they own different parts of the work.
mechanism: Normalize each system across job, control, state, authority, recovery, verification, and deliberate omission before comparing it.
failure_boundary: A normalized diagram can still invent equivalence if an unsupported responsibility is silently marked as owned.
transferable_lesson: Compare the same questions across systems, while preserving different product boundaries and explicit unknowns.
